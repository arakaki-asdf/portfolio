name: Deploy Vue 3 Vite App

on:
  push:
    branches:
      - master
  # GitHub Pagesの設定画面から手動で実行できるようにする
  workflow_dispatch:

# ワークフローに必要な権限を設定
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # ★ビルド成果物（Vueの静的ファイル）があるディレクトリを指定
    # デプロイジョブへの出力を設定
    outputs:
      deployment_id: ${{ steps.deployment.outputs.deployment_id }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4